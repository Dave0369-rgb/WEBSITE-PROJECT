<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple study planner that saves your tasks in your browser.">
    <title>Medds Nova - Academic Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav>
            <a class="brand" href="index.html">MEDDS NOVA</a>
            <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
            <ul id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>

            <li><a href="planner.html" class="active" aria-current="page">Academic Planner</a></li>

            </ul>
        </nav>

    <section id="planner">
        <h2>Academic Planner</h2>
        <p class="muted">Your tasks are saved in this browser, so they will still be here when you come back.</p>
        <div class="planner-container">
            <input type="text" id="taskInput" placeholder="Enter a new study task..." aria-label="New study task">
            <button type="button" onclick="addTask()">Add Task</button>
            <ul id="taskList"></ul>
            <p id="taskCount" class="muted"></p>
        </div>
    </section>
